kind: repo
version: udx.dev/rabbit.ci/repo/v1
repository:
  name: github-rabbit-action
  owner: udx
  default_branch: production
branches:
  - name: infra-templates
    rules: {}
  - name: lifecycle-action-integration
    rules: {}
  - name: opentofu-test
    rules: {}
  - name: production
    rules:
      allow_deletions: false
      allow_force_pushes: false
      pull_request:
        approvals: 1
        code_owner_review: true
        stale_reviews: true
        last_push_approval: false
        conversation_resolution: true
        merge_methods:
          - merge
          - squash
          - rebase
      copilot_review:
        on_push: true
        drafts: false
configuration:
  secrets:
    organization:
      - BITBUCKET_TOKEN
      - CONTEXT7_API_KEY
      - DEPENDABOT_REVIEWER_TOKEN
    repository: []
  variables:
    organization:
      - DOCKER_LOGIN
      - DOCKER_ORG
      - GCP_PROJECT_ID
      - GCP_REGION
      - GCP_WORKLOAD_IDENTITY_PROVIDER
      - GH_SERVICE_ACCOUNT_EMAIL
    repository: []
environments:
  - name: copilot
    branches:
      - "*"
    approvals: []
    wait_minutes: 0
    admin_bypass: true
    secrets: []
    variables: []
workflows:
  - path: .github/workflows/ci.yml
    triggers:
      pull_request: {}
      push:
        branches:
          - production
          - lifecycle-action-integration
    permissions:
      contents: read
